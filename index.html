<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Chess Arena</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Chess Pieces & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chess.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        /* Base Theming System */
        :root {
            /* Fallback defaults (Dark Mode) */
            --bg-body: rgb(16, 24, 39);
            --bg-panel: rgb(31, 41, 55);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            
            --board-light: #475569;
            --board-dark: #1e293b;
            --board-border: 4px solid #0f172a;
            
            --piece-white: #ffffff;
            --piece-white-stroke: #000000;
            --piece-black: #000000;
            --piece-black-stroke: #ffffff;
            
            --font-main: 'Segoe UI', system-ui, sans-serif;
        }

        [data-theme="classic"] {
            --bg-body: #f3f4f6;
            --bg-panel: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent: #ca8a04;
            
            --board-light: #eedcba;
            --board-dark: #b88b4a;
            --board-border: 8px solid #5c3a21;
            
            --piece-white: #ffffff;
            --piece-white-stroke: #333333;
            --piece-black: #222222;
            --piece-black-stroke: #f3f4f6;
        }

        [data-theme="terminal"] {
            --bg-body: #000000;
            --bg-panel: #0a0a0a;
            --text-main: #4ade80;
            --text-muted: #166534;
            --accent: #facc15;
            
            --board-light: #111111;
            --board-dark: #000000;
            --board-border: 2px solid #4ade80;
            
            --piece-white: #4ade80;
            --piece-white-stroke: transparent;
            --piece-black: #166534;
            --piece-black-stroke: #4ade80;
            
            --font-main: 'Courier New', Courier, monospace;
        }

        [data-theme="futuristic"] {
            --bg-body: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.7);
            --text-main: #e0e7ff;
            --text-muted: #818cf8;
            --accent: #f43f5e;
            
            --board-light: rgba(14, 165, 233, 0.2);
            --board-dark: rgba(139, 92, 246, 0.2);
            --board-border: 1px solid #0ea5e9;
            
            --piece-white: #0ea5e9;
            --piece-white-stroke: #ffffff;
            --piece-black: #f43f5e;
            --piece-black-stroke: #ffffff;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            margin: 0;
            overflow-x: hidden;
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Chess Board Styles */
        .board-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            border: var(--board-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem; /* Responsive fallback in inline styles later */
            user-select: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        @media (max-width: 600px) {
            .square { font-size: 1.8rem; }
        }
        @media (max-width: 400px) {
            .square { font-size: 1.4rem; }
        }

        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        /* Highlight states */
        .square.selected {
            background-color: rgba(234, 179, 8, 0.6) !important;
        }
        .square.last-move {
            background-color: rgba(56, 189, 248, 0.3) !important;
        }
        .square.in-check {
            background-color: rgba(239, 68, 68, 0.5) !important;
        }

        /* Valid Move Indicators */
        .valid-move-dot {
            width: 25%;
            height: 25%;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }
        [data-theme="terminal"] .valid-move-dot { background-color: var(--text-main); }
        [data-theme="futuristic"] .valid-move-dot { box-shadow: 0 0 10px var(--accent); background-color: var(--accent); }

        .valid-capture-ring {
            width: 90%;
            height: 90%;
            border: 4px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        /* Piece Styling */
        .piece {
            z-index: 10;
            transition: transform 0.15s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }
        
        .piece.white {
            color: var(--piece-white);
            text-shadow: 0 0 2px var(--piece-white-stroke), 0 0 4px var(--piece-white-stroke);
        }
        
        .piece.black {
            color: var(--piece-black);
            text-shadow: 0 0 2px var(--piece-black-stroke), 0 0 4px var(--piece-black-stroke);
        }

        .piece.dragging {
            transform: scale(1.2);
            opacity: 0.9;
            z-index: 100;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Modals & Menus */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }
        
        /* Custom Scrollbar for terminal vibe */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--board-light); border-radius: 4px; }
    </style>
</head>
<body data-theme="dark" class="flex flex-col min-h-screen">

    <!-- Header Navigation -->
    <header class="panel flex items-center justify-between p-4 shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <button id="menu-btn" class="p-2 rounded hover:bg-white/10 transition-colors">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <h1 class="text-xl font-bold tracking-wider uppercase"><i class="fa-solid fa-chess mr-2"></i>io.Chess</h1>
        </div>
        
        <div class="flex items-center gap-4 text-sm font-medium">
            <span id="connection-status" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500"></span> Local
            </span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 w-full max-w-4xl mx-auto gap-4">
        
        <!-- Game Status Announcement -->
        <div id="game-announcement" class="h-8 flex items-center justify-center font-bold text-lg tracking-wide hidden w-full rounded panel">
            <!-- Populated by JS -->
        </div>

        <!-- Top HUD (Opponent) -->
        <div class="w-full max-w-[600px] flex items-center justify-between px-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full panel flex items-center justify-center shadow-inner">
                    <i id="top-avatar" class="fa-solid fa-robot text-xl"></i>
                </div>
                <div>
                    <div id="top-name" class="font-bold">King's Arena</div>
                    <div id="top-material" class="text-xs font-mono text-[var(--accent)] h-4"></div>
                </div>
            </div>
            <div id="top-timer" class="font-mono text-2xl font-bold panel px-4 py-1 rounded shadow-inner">10:00</div>
        </div>

        <!-- Chess Board -->
        <div id="board" class="board-container">
            <!-- Squares generated by JS -->
        </div>

        <!-- Bottom HUD (Player) -->
        <div class="w-full max-w-[600px] flex items-center justify-between px-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full panel flex items-center justify-center shadow-inner">
                    <i id="bottom-avatar" class="fa-solid fa-user text-xl"></i>
                </div>
                <div>
                    <div id="bottom-name" class="font-bold">Player (White)</div>
                    <div id="bottom-material" class="text-xs font-mono text-[var(--accent)] h-4"></div>
                </div>
            </div>
            <div id="bottom-timer" class="font-mono text-2xl font-bold panel px-4 py-1 rounded shadow-inner">10:00</div>
        </div>

        <!-- Controls -->
        <div class="w-full max-w-[600px] flex gap-2 mt-2">
            <button id="btn-undo" class="flex-1 panel py-3 rounded font-bold hover:bg-white/5 transition flex items-center justify-center gap-2" disabled>
                <i class="fa-solid fa-rotate-left"></i> Undo
            </button>
            <button id="btn-reset" class="flex-1 panel py-3 rounded font-bold hover:bg-white/5 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-power-off"></i> Reset
            </button>
            <button id="btn-resign" class="flex-1 panel py-3 rounded font-bold hover:bg-white/5 transition flex items-center justify-center gap-2 text-red-500">
                <i class="fa-solid fa-flag"></i> Resign
            </button>
        </div>

    </main>

    <!-- Side Menu (Hidden by default) -->
    <div id="side-menu" class="fixed inset-y-0 left-0 w-80 panel shadow-2xl transform -translate-x-full transition-transform duration-300 z-[60] flex flex-col">
        <div class="p-6 border-b border-white/10 flex justify-between items-center">
            <h2 class="text-2xl font-bold">Settings</h2>
            <button id="close-menu-btn" class="p-2 hover:bg-white/10 rounded"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <div class="p-6 flex-1 overflow-y-auto flex flex-col gap-6">
            <!-- Game Mode -->
            <div>
                <label class="block text-sm font-bold mb-2 uppercase tracking-wider text-[var(--text-muted)]">Game Mode</label>
                <div class="flex gap-2">
                    <button class="mode-btn flex-1 panel py-2 rounded border border-[var(--accent)] bg-white/5 text-[var(--accent)]" data-mode="llm">vs LLM</button>
                    <button class="mode-btn flex-1 panel py-2 rounded hover:bg-white/10 border border-transparent" data-mode="pvp">PvP Local</button>
                </div>
            </div>

            <!-- LLM Settings -->
            <div id="llm-settings" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-bold mb-2 uppercase tracking-wider text-[var(--text-muted)]">LLM Difficulty</label>
                    <select id="select-difficulty" class="w-full panel p-3 rounded appearance-none outline-none focus:border-[var(--accent)] border border-transparent transition">
                        <option value="easy">Casual (Temp: 0.8)</option>
                        <option value="hard" selected>Ruthless (Temp: 0.1)</option>
                    </select>
                </div>
            </div>

            <!-- Time Control -->
            <div>
                <label class="block text-sm font-bold mb-2 uppercase tracking-wider text-[var(--text-muted)]">Time Control</label>
                <select id="select-time" class="w-full panel p-3 rounded appearance-none outline-none focus:border-[var(--accent)] border border-transparent transition">
                    <option value="300">5 Minutes (Blitz)</option>
                    <option value="600" selected>10 Minutes (Rapid)</option>
                    <option value="1800">30 Minutes (Classical)</option>
                </select>
            </div>

            <!-- Theming -->
            <div>
                <label class="block text-sm font-bold mb-2 uppercase tracking-wider text-[var(--text-muted)]">Interface Theme</label>
                <div class="grid grid-cols-2 gap-2">
                    <button class="theme-btn panel py-2 rounded text-sm hover:bg-white/10" data-theme-target="dark">Dark</button>
                    <button class="theme-btn panel py-2 rounded text-sm hover:bg-white/10" data-theme-target="classic">Classic</button>
                    <button class="theme-btn panel py-2 rounded text-sm hover:bg-white/10" data-theme-target="terminal">Terminal</button>
                    <button class="theme-btn panel py-2 rounded text-sm hover:bg-white/10" data-theme-target="futuristic">Futuristic</button>
                </div>
            </div>
        </div>
        
        <div class="p-6 border-t border-white/10 text-xs text-[var(--text-muted)] text-center">
            Powered by Gemini 2.5 Flash & chess.js<br>
            <span class="opacity-50">Local environment API key used automatically.</span>
        </div>
    </div>

    <!-- Overlay for Menu -->
    <div id="menu-overlay" class="fixed inset-0 modal-overlay hidden z-[55] opacity-0 transition-opacity duration-300"></div>

    <script>
        /**
         * GLOBAL CONFIGURATION & API
         * The execution environment provides the key at runtime.
         */
        const apiKey = ""; 

        /**
         * CHESS APPLICATION LOGIC
         */
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- CONSTANTS & MAPS ---
            const PIECE_ICONS = {
                'p': 'fa-chess-pawn',
                'n': 'fa-chess-knight',
                'b': 'fa-chess-bishop',
                'r': 'fa-chess-rook',
                'q': 'fa-chess-queen',
                'k': 'fa-chess-king'
            };
            
            const MATERIAL_VALUES = { 'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 0 };

            // --- STATE MANAGEMENT ---
            const state = {
                game: new Chess(),
                mode: 'llm', // 'llm' or 'pvp'
                difficulty: 'hard', // 'easy' or 'hard'
                timeControl: 600, // in seconds
                timers: { w: 600, b: 600 },
                timerInterval: null,
                playerColor: 'w',
                
                selectedSquare: null,
                validMovesForSelected: [],
                lastMove: { from: null, to: null },
                
                isThinking: false,
                isGameOver: false,
                
                theme: 'dark'
            };

            // --- DOM ELEMENTS ---
            const boardEl = document.getElementById('board');
            const topTimerEl = document.getElementById('top-timer');
            const bottomTimerEl = document.getElementById('bottom-timer');
            const topMaterialEl = document.getElementById('top-material');
            const bottomMaterialEl = document.getElementById('bottom-material');
            const topNameEl = document.getElementById('top-name');
            const bottomNameEl = document.getElementById('bottom-name');
            const topAvatarEl = document.getElementById('top-avatar');
            const bottomAvatarEl = document.getElementById('bottom-avatar');
            const announcementEl = document.getElementById('game-announcement');
            const connectionStatusEl = document.getElementById('connection-status');
            
            const btnUndo = document.getElementById('btn-undo');
            const btnReset = document.getElementById('btn-reset');
            const btnResign = document.getElementById('btn-resign');

            // --- UI INITIALIZATION ---
            function initUI() {
                buildBoardGrid();
                updateBoard();
                setupEventListeners();
                resetTimers();
            }

            function buildBoardGrid() {
                boardEl.innerHTML = '';
                // 64 squares. We render from top-left to bottom-right.
                // If player is White, top-left is a8, bottom-right is h1.
                // If player is Black, top-left is h1, bottom-right is a8.
                for (let i = 0; i < 64; i++) {
                    const row = Math.floor(i / 8);
                    const col = i % 8;
                    
                    // Standard visual: row 0 is rank 8. col 0 is file 'a'.
                    let rank = 8 - row;
                    let file = String.fromCharCode(97 + col);
                    
                    if (state.playerColor === 'b') {
                        rank = row + 1;
                        file = String.fromCharCode(104 - col);
                    }

                    const squareId = `${file}${rank}`;
                    
                    const square = document.createElement('div');
                    square.classList.add('square');
                    // Calculate light/dark. Even sum of (row+col) is light if we look at the grid natively.
                    if ((row + col) % 2 === 0) {
                        square.classList.add('light');
                    } else {
                        square.classList.add('dark');
                    }
                    
                    square.dataset.id = squareId;
                    square.addEventListener('click', () => handleSquareClick(squareId));
                    
                    boardEl.appendChild(square);
                }
            }

            function updateBoard() {
                const board = state.game.board(); // 8x8 array. null or {type, color}
                
                // Reset all squares
                document.querySelectorAll('.square').forEach(sq => {
                    sq.innerHTML = '';
                    sq.classList.remove('selected', 'last-move', 'in-check');
                });

                // Apply last move highlights
                if (state.lastMove.from) {
                    const sqFrom = document.querySelector(`[data-id="${state.lastMove.from}"]`);
                    const sqTo = document.querySelector(`[data-id="${state.lastMove.to}"]`);
                    if (sqFrom) sqFrom.classList.add('last-move');
                    if (sqTo) sqTo.classList.add('last-move');
                }

                // Apply Check highlight
                if (state.game.in_check()) {
                    // Find the king of the side to move
                    const turnColor = state.game.turn();
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = board[r][c];
                            if (p && p.type === 'k' && p.color === turnColor) {
                                // convert r, c to square ID
                                const rank = 8 - r;
                                const file = String.fromCharCode(97 + c);
                                const sqEl = document.querySelector(`[data-id="${file}${rank}"]`);
                                if (sqEl) sqEl.classList.add('in-check');
                            }
                        }
                    }
                }

                // Place pieces
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const piece = board[r][c];
                        if (piece) {
                            const rank = 8 - r;
                            const file = String.fromCharCode(97 + c);
                            const sqId = `${file}${rank}`;
                            
                            const sqEl = document.querySelector(`[data-id="${sqId}"]`);
                            if (sqEl) {
                                const pieceIcon = document.createElement('i');
                                pieceIcon.className = `piece fa-solid ${PIECE_ICONS[piece.type]} ${piece.color === 'w' ? 'white' : 'black'}`;
                                sqEl.appendChild(pieceIcon);
                            }
                        }
                    }
                }

                // Handle valid move highlights if a piece is selected
                if (state.selectedSquare) {
                    const selSq = document.querySelector(`[data-id="${state.selectedSquare}"]`);
                    if(selSq) selSq.classList.add('selected');
                    
                    state.validMovesForSelected.forEach(move => {
                        const targetSq = document.querySelector(`[data-id="${move.to}"]`);
                        if (targetSq) {
                            // Check if it's a capture
                            const isCapture = state.game.get(move.to) !== null;
                            const hint = document.createElement('div');
                            hint.className = isCapture ? 'valid-capture-ring' : 'valid-move-dot';
                            targetSq.appendChild(hint);
                        }
                    });
                }

                updateMaterial();
                checkGameState();
            }

            function updateMaterial() {
                const board = state.game.board();
                let wScore = 0;
                let bScore = 0;

                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p) {
                            if (p.color === 'w') wScore += MATERIAL_VALUES[p.type];
                            if (p.color === 'b') bScore += MATERIAL_VALUES[p.type];
                        }
                    }
                }

                const diff = wScore - bScore;
                
                // If player is white (bottom is white)
                if (state.playerColor === 'w') {
                    bottomMaterialEl.innerText = diff > 0 ? `+${diff}` : '';
                    topMaterialEl.innerText = diff < 0 ? `+${Math.abs(diff)}` : '';
                } else {
                    bottomMaterialEl.innerText = diff < 0 ? `+${Math.abs(diff)}` : '';
                    topMaterialEl.innerText = diff > 0 ? `+${diff}` : '';
                }
            }

            // --- INTERACTION LOGIC ---

            function handleSquareClick(squareId) {
                if (state.isGameOver || state.isThinking) return;
                
                const pieceOnSquare = state.game.get(squareId);
                const turnColor = state.game.turn();

                // If in LLM mode, prevent clicking if it's not player's turn
                if (state.mode === 'llm' && turnColor !== state.playerColor) return;

                // 1. If no square selected, select if it's our piece
                if (!state.selectedSquare) {
                    if (pieceOnSquare && pieceOnSquare.color === turnColor) {
                        selectSquare(squareId);
                    }
                } 
                // 2. If a square is already selected
                else {
                    // Check if clicked square is a valid move
                    const moveAttempt = state.validMovesForSelected.find(m => m.to === squareId);
                    
                    if (moveAttempt) {
                        // Execute move
                        executeMove(moveAttempt.san);
                    } 
                    // If clicking own piece, switch selection
                    else if (pieceOnSquare && pieceOnSquare.color === turnColor) {
                        selectSquare(squareId);
                    } 
                    // Otherwise deselect
                    else {
                        clearSelection();
                        updateBoard();
                    }
                }
            }

            function selectSquare(squareId) {
                state.selectedSquare = squareId;
                // Get valid moves for this square using verbose mode to get 'to' square easily
                state.validMovesForSelected = state.game.moves({ square: squareId, verbose: true });
                updateBoard();
            }

            function clearSelection() {
                state.selectedSquare = null;
                state.validMovesForSelected = [];
            }

            function executeMove(sanMove) {
                clearSelection();
                
                const moveResult = state.game.move(sanMove);
                if (!moveResult) return; // Should not happen given we use valid SAN

                state.lastMove = { from: moveResult.from, to: moveResult.to };
                
                updateBoard();
                
                btnUndo.disabled = false;

                if (!state.game.game_over()) {
                    if (state.mode === 'llm' && state.game.turn() !== state.playerColor) {
                        triggerLLMTurn();
                    }
                }
            }

            function undoMove() {
                if (state.isThinking || state.game.history().length === 0) return;
                
                state.game.undo();
                if (state.mode === 'llm') {
                    // Undo twice in LLM mode to get back to player's turn
                    state.game.undo(); 
                }

                // Reset last move visuals
                const history = state.game.history({ verbose: true });
                if (history.length > 0) {
                    const last = history[history.length - 1];
                    state.lastMove = { from: last.from, to: last.to };
                } else {
                    state.lastMove = { from: null, to: null };
                }

                state.isGameOver = false;
                announcementEl.classList.add('hidden');
                btnUndo.disabled = state.game.history().length === 0;
                
                updateBoard();
            }

            function resetGame() {
                state.game.reset();
                state.isGameOver = false;
                state.isThinking = false;
                state.lastMove = { from: null, to: null };
                clearSelection();
                resetTimers();
                
                announcementEl.classList.add('hidden');
                btnUndo.disabled = true;
                
                updateBoard();
                
                if (state.mode === 'llm' && state.playerColor === 'b') {
                    triggerLLMTurn();
                }
            }

            function resign() {
                if(state.isGameOver) return;
                state.isGameOver = true;
                showAnnouncement("You Resigned. Opponent Wins.", "text-red-500");
                clearInterval(state.timerInterval);
            }

            // --- LLM INTEGRATION ---

            async function triggerLLMTurn() {
                if (state.isGameOver) return;
                
                state.isThinking = true;
                connectionStatusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> LLM Thinking...';
                
                const fen = state.game.fen();
                const legalMoves = state.game.moves(); // Array of SAN moves
                
                const prompt = `You are a chess engine playing ${state.game.turn() === 'w' ? 'White' : 'Black'}. 
Current FEN: ${fen}
Legal moves: ${legalMoves.join(', ')}
Respond ONLY with the exact Standard Algebraic Notation (SAN) string of your chosen move from the list of legal moves. Do not include quotes, periods, explanations, or any other text.`;

                let chosenMove = null;
                
                try {
                    // Fallback to random move if no API key is injected by environment to prevent freezing
                    if (!apiKey || apiKey.trim() === "") {
                        console.warn("No API key provided by environment. Falling back to random move for testing.");
                        await new Promise(r => setTimeout(r, 1000)); // simulate delay
                        chosenMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
                    } else {
                        chosenMove = await fetchGeminiMove(prompt, legalMoves);
                    }

                } catch (error) {
                    console.error("LLM Error:", error);
                    // Fallback to random if all fails
                    chosenMove = legalMoves[Math.floor(Math.random() * legalMoves.length)];
                }

                state.isThinking = false;
                connectionStatusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-blue-500"></span> Connected';
                
                if (chosenMove && !state.isGameOver) {
                    executeMove(chosenMove);
                }
            }

            async function fetchGeminiMove(prompt, legalMoves) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const temperature = state.difficulty === 'hard' ? 0.0 : 0.8;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: "You are a chess engine. Output exactly one valid SAN move from the provided list." }] },
                    generationConfig: { temperature: temperature }
                };

                // Implement exponential backoff retry mechanism
                let retries = 5;
                let delay = 1000;
                
                while (retries > 0) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        
                        const data = await response.json();
                        let responseText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                        
                        // Clean up markdown or stray characters
                        responseText = responseText.replace(/`/g, '').trim();

                        // Strict check
                        if (legalMoves.includes(responseText)) {
                            return responseText;
                        }
                        
                        // Loose check (hallucination cleanup)
                        const looseMatch = legalMoves.find(m => m.includes(responseText) || responseText.includes(m));
                        if (looseMatch) {
                            return looseMatch;
                        }
                        
                        throw new Error(`Invalid move returned: ${responseText}`);
                        
                    } catch (e) {
                        retries--;
                        if (retries === 0) throw e;
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }
                }
                return null;
            }


            // --- TIMERS & GAME LOOP ---

            function resetTimers() {
                clearInterval(state.timerInterval);
                state.timers = { w: state.timeControl, b: state.timeControl };
                updateTimerDisplay();
                state.timerInterval = setInterval(tickTimer, 1000);
            }

            function tickTimer() {
                if (state.isGameOver) {
                    clearInterval(state.timerInterval);
                    return;
                }
                
                // In LLM mode, pause timer while LLM thinks to be fair
                if (state.mode === 'llm' && state.isThinking) return;

                const turn = state.game.turn();
                state.timers[turn] -= 1;
                
                if (state.timers[turn] <= 0) {
                    state.timers[turn] = 0;
                    state.isGameOver = true;
                    showAnnouncement(`Time Out! ${turn === 'w' ? 'Black' : 'White'} wins.`, "text-red-500");
                }
                
                updateTimerDisplay();
            }

            function updateTimerDisplay() {
                const formatTime = (seconds) => {
                    const m = Math.floor(seconds / 60);
                    const s = seconds % 60;
                    return `${m}:${s.toString().padStart(2, '0')}`;
                };

                // Bottom is always player (White default)
                if (state.playerColor === 'w') {
                    bottomTimerEl.innerText = formatTime(state.timers.w);
                    topTimerEl.innerText = formatTime(state.timers.b);
                } else {
                    bottomTimerEl.innerText = formatTime(state.timers.b);
                    topTimerEl.innerText = formatTime(state.timers.w);
                }
            }

            function checkGameState() {
                if (state.game.game_over()) {
                    state.isGameOver = true;
                    clearInterval(state.timerInterval);
                    
                    if (state.game.in_checkmate()) {
                        const winner = state.game.turn() === 'w' ? 'Black' : 'White';
                        showAnnouncement(`Checkmate! ${winner} wins.`, "text-yellow-400");
                    } else if (state.game.in_draw()) {
                        showAnnouncement("Game Drawn", "text-blue-400");
                    } else if (state.game.in_stalemate()) {
                        showAnnouncement("Stalemate - Draw", "text-blue-400");
                    } else if (state.game.in_threefold_repetition()) {
                        showAnnouncement("Draw by Repetition", "text-blue-400");
                    } else if (state.game.insufficient_material()) {
                        showAnnouncement("Draw (Insufficient Material)", "text-blue-400");
                    }
                }
            }

            function showAnnouncement(msg, colorClass) {
                announcementEl.className = `h-12 flex items-center justify-center font-bold text-xl tracking-wide w-full rounded panel shadow-lg mb-4 ${colorClass} animate-pulse-fast`;
                announcementEl.innerText = msg;
            }

            // --- SETTINGS & MENU UI ---

            function setupEventListeners() {
                // Controls
                btnUndo.addEventListener('click', undoMove);
                btnReset.addEventListener('click', resetGame);
                btnResign.addEventListener('click', resign);

                // Menu Toggles
                const menuBtn = document.getElementById('menu-btn');
                const closeMenuBtn = document.getElementById('close-menu-btn');
                const sideMenu = document.getElementById('side-menu');
                const menuOverlay = document.getElementById('menu-overlay');

                function toggleMenu(show) {
                    if (show) {
                        sideMenu.classList.remove('-translate-x-full');
                        menuOverlay.classList.remove('hidden');
                        // Small delay to allow display:block to take effect before opacity transition
                        setTimeout(() => menuOverlay.classList.remove('opacity-0'), 10);
                    } else {
                        sideMenu.classList.add('-translate-x-full');
                        menuOverlay.classList.add('opacity-0');
                        setTimeout(() => menuOverlay.classList.add('hidden'), 300);
                    }
                }

                menuBtn.addEventListener('click', () => toggleMenu(true));
                closeMenuBtn.addEventListener('click', () => toggleMenu(false));
                menuOverlay.addEventListener('click', () => toggleMenu(false));

                // Mode Selection
                const modeBtns = document.querySelectorAll('.mode-btn');
                modeBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const newMode = e.target.dataset.mode;
                        
                        // UI update
                        modeBtns.forEach(b => {
                            b.classList.remove('border-[var(--accent)]', 'text-[var(--accent)]', 'bg-white/5');
                            b.classList.add('border-transparent');
                        });
                        e.target.classList.add('border-[var(--accent)]', 'text-[var(--accent)]', 'bg-white/5');
                        e.target.classList.remove('border-transparent');

                        const llmSettings = document.getElementById('llm-settings');
                        if (newMode === 'pvp') {
                            llmSettings.classList.add('opacity-50', 'pointer-events-none');
                            topNameEl.innerText = "Player 2 (Black)";
                            topAvatarEl.className = "fa-solid fa-user text-xl";
                        } else {
                            llmSettings.classList.remove('opacity-50', 'pointer-events-none');
                            topNameEl.innerText = "Gemini (Black)";
                            topAvatarEl.className = "fa-solid fa-robot text-xl";
                        }

                        // State update
                        if (state.mode !== newMode) {
                            state.mode = newMode;
                            resetGame();
                        }
                    });
                });

                // Difficulty
                document.getElementById('select-difficulty').addEventListener('change', (e) => {
                    state.difficulty = e.target.value;
                });

                // Time Control
                document.getElementById('select-time').addEventListener('change', (e) => {
                    state.timeControl = parseInt(e.target.value, 10);
                    if(!state.game.history().length) {
                        resetTimers(); // Only apply if game hasn't really started
                    } else {
                        // Notify user it will apply next game? 
                        // For simplicity, just let it queue up for reset.
                    }
                });

                // Theming
                const themeBtns = document.querySelectorAll('.theme-btn');
                themeBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const newTheme = e.target.dataset.themeTarget;
                        document.body.dataset.theme = newTheme;
                        
                        themeBtns.forEach(b => b.classList.remove('border', 'border-[var(--accent)]'));
                        e.target.classList.add('border', 'border-[var(--accent)]');
                    });
                });
                
                // Init active theme UI
                document.querySelector('[data-theme-target="dark"]').classList.add('border', 'border-[var(--accent)]');
            }

            // BOOTSTRAP
            initUI();
            
        });
    </script>
</body>
</html>
